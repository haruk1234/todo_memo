<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>やることメモ</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; }
    h1 { margin-bottom: 12px; }
    form.add { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 10px; }
    button { padding: 10px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 8px; }
    .done { text-decoration: line-through; opacity: 0.6; }
    .right { margin-left: auto; display: flex; gap: 8px; }
    a { text-decoration: none; padding: 6px 10px; border: 1px solid #ccc; border-radius: 8px; }
    a:hover { background: #f2f2f2; }
  </style>
</head>
<body>
  <h1>やることメモ</h1>

  <!-- 追加フォーム -->
  <form class="add" method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="やることを入力..." />
    <button type="submit">追加</button>
  </form>

  <!-- 一覧 -->
  <ul>
    {% for task in tasks %}
      <li>
        <span class="{% if task.is_done %}done{% endif %}">
          {{ task.title }}
        </span>

        <div class="right">
          <a href="{% url 'todo:toggle' task.id %}">
            {% if task.is_done %}未完了に戻す{% else %}完了{% endif %}
          </a>

          <a href="{% url 'todo:delete' task.id %}" onclick="return confirm('削除しますか？');">
            削除
          </a>
        </div>
      </li>
    {% empty %}
      <li>まだタスクがありません。</li>
    {% endfor %}
  </ul>

  <p><a href="/admin/">管理画面へ</a></p>
</body>
</html>
